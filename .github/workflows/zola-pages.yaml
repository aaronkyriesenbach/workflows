name: Zola Build and Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      zola-version:
        description: Zola version to build with, without the leading "v"
        type: string
        required: true
      working-directory:
        description: >-
          Directory containing the Zola project (config.toml), relative to
          the repo root. zola build runs here; only useful for monorepo
          callers.
        type: string
        default: "."

# cancel-in-progress:false avoids a double-push leaving Pages half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Zola ${{ inputs.zola-version }}
        env:
          ZOLA_VERSION: ${{ inputs.zola-version }}
        run: |
          set -euo pipefail
          URL="https://github.com/getzola/zola/releases/download"
          curl -sSL \
            "${URL}/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz
          sudo mv zola /usr/local/bin/zola

      - name: Build
        run: zola build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ inputs.working-directory }}/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    # `github-pages` environment is auto-created by GitHub on first deploy.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
