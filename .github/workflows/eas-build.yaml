name: EAS Build

on:
  workflow_call:
    inputs:
      platform:
        type: string
        default: ios
      profile:
        type: string
        default: production
      node-version:
        type: string
        default: "22"
      install-command:
        type: string
        default: yarn install --frozen-lockfile
      working-directory:
        type: string
        default: "."
      auto-submit:
        type: boolean
        default: true
      bump-patch-for-test-build:
        type: boolean
        default: false
    secrets:
      expo-token:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - run: ${{ inputs.install-command }}

      - name: Bump patch version for ad hoc test build (workspace-only, never committed)
        if: inputs.bump-patch-for-test-build
        run: |
          version=$(jq -r '.expo.version' app.json)
          IFS='.' read -r major minor patch <<< "$version"
          new_version="${major}.${minor}.$((patch + 1))"
          jq --arg v "$new_version" '.expo.version = $v' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "Ephemeral test version: $new_version"

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.expo-token }}

      - name: eas build
        run: >
          eas build --platform ${{ inputs.platform }}
          --profile ${{ inputs.profile }} --non-interactive
          ${{ inputs.auto-submit && '--auto-submit' || '' }}
