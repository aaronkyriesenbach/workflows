name: Bun Build and Publish

on:
  workflow_call:
    inputs:
      bun-version:
        type: string
        default: "latest"
      working-directory:
        description: >-
          Directory to run install/build/publish steps in, relative to the
          repo root. Defaults to the repo root itself, so single-package
          callers are unaffected.
        type: string
        default: "."

jobs:
  publish:
    runs-on: ubuntu-latest

    # `release` has no protection rules and behaves like no environment
    # at all. `branch-preview` requires manual approval (configured once
    # in repo Settings > Environments) so branch snapshots are never
    # published unattended. If nobody approves, `timeout-minutes` cancels
    # the job after waiting 1 day.
    environment: >-
      ${{ github.ref_name == 'master' && 'release' || 'branch-preview' }}
    timeout-minutes: ${{ github.ref_name == 'master' && 30 || 1440 }}

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - run: bun install --frozen-lockfile

      # `bun publish` has no OIDC support (oven-sh/bun#22423); npm >= 11.5.1 needs Node >= 22.14.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Determine version and dist-tag
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            # release-please already bumped package.json's version on merge.
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            SAFE_BRANCH=$(echo "${{ github.ref_name }}" \
              | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            BASE_VERSION=$(node -p "require('./package.json').version")
            bun pm version "${BASE_VERSION}-${SAFE_BRANCH}.${SHORT_SHA}" \
              --no-git-tag-version
            echo "tag=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: npm publish --tag ${{ steps.meta.outputs.tag }} --access public
