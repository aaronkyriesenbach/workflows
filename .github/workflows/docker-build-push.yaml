name: Docker Build and Push

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Version to tag the release image with (used only for master
          builds) and to pass through to the image build as the VERSION
          build-arg
        type: string
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # `release` has no protection rules and behaves like no environment
    # at all. `branch-preview` requires manual approval (configured once
    # in repo Settings > Environments) so branch images are never pushed
    # unattended. If nobody approves, `timeout-minutes` cancels the job
    # after waiting 1 day.
    environment: >-
      ${{ github.ref_name == 'master' && 'release' || 'branch-preview' }}
    timeout-minutes: ${{ github.ref_name == 'master' && 360 || 1440 }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Docker tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

          if [[ "${{ github.ref_name }}" == "master" ]]; then
            TAGS="${IMAGE}:${{ inputs.version }},${IMAGE}:latest"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            SAFE_BRANCH=$(echo "${{ github.ref_name }}" \
              | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            TAGS="${IMAGE}:${SAFE_BRANCH}-${SHORT_SHA}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
